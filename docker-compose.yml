services:
  app:
    build:
      context: .
    image: industrial-task-recognition:camera-gui
    container_name: industrial-task-recognition
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: 8501
    devices:
      - "${VIDEO_DEVICE:-/dev/video0}:${VIDEO_DEVICE:-/dev/video0}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./calibration:/app/calibration
      - ./config:/app/config
      - ./model:/app/model:ro
      - ./output:/app/output
    ports:
      - "8501:8501"
